<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏</title>
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        :root {
            --bg-0: #eef4ff;
            --bg-1: #dbe8fb;
            --panel: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(124, 149, 184, 0.24);
            --text-main: #24374f;
            --text-muted: #6c819a;
            --accent: #5f84ff;
            --accent-2: #5eb7ff;
            --danger: #ff6e88;
            --btn-bg: rgba(95, 132, 255, 0.1);
            --btn-border: rgba(101, 134, 196, 0.32);
            --btn-active-bg: linear-gradient(135deg, #5f84ff, #6bb7ff);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 15% 12%, rgba(132, 175, 255, 0.32), transparent 38%),
                radial-gradient(circle at 82% 78%, rgba(149, 213, 255, 0.26), transparent 30%),
                linear-gradient(145deg, var(--bg-0), var(--bg-1));
        }

        .home-btn {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            box-shadow: 0 10px 20px rgba(75, 100, 139, 0.22);
            color: var(--text-main);
            display: grid;
            place-items: center;
            z-index: 9;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px) scale(1.03);
            background: rgba(255, 255, 255, 1);
        }

        .home-btn:active {
            transform: scale(0.95);
        }

        .home-btn svg {
            width: 22px;
            height: 22px;
            fill: #5d84ff;
        }

        .game-container {
            width: min(100%, 468px);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 16px 30px rgba(108, 130, 167, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(7px);
            text-align: center;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #2f4561;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 4px 8px rgba(107, 145, 204, 0.35));
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }

        .score-card {
            border-radius: 9px;
            background: rgba(240, 246, 255, 0.92);
            border: 1px solid rgba(124, 149, 184, 0.2);
            padding: 5px 6px;
        }

        .score-card .label {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 1px;
        }

        .score-card .value {
            display: block;
            font-size: 14px;
            color: #2b425f;
            font-weight: 700;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }

        .control-section {
            text-align: left;
            padding: 6px;
            border-radius: 9px;
            background: rgba(240, 246, 255, 0.92);
            border: 1px solid rgba(124, 149, 184, 0.2);
        }

        .control-title {
            font-size: 11px;
            color: #5d7595;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }

        .btn-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .difficulty-btn,
        .map-btn {
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: #4a6589;
            border-radius: 999px;
            font-size: 11px;
            padding: 5px 9px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
        }

        .difficulty-btn:hover,
        .map-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(90, 113, 150, 0.24);
        }

        .difficulty-btn.selected,
        .map-btn.selected {
            background: var(--btn-active-bg);
            border-color: transparent;
            color: #f8fbff;
            font-weight: 700;
        }

        #gameCanvas {
            display: block;
            width: 360px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 6px;
            border: 2px solid rgba(130, 155, 191, 0.34);
            border-radius: 12px;
            background: #eef2f7;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4), 0 12px 20px rgba(102, 124, 158, 0.24);
        }

        .controls {
            font-size: 11px;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        button.action-btn {
            border: 1px solid rgba(91, 231, 169, 0.28);
            background: linear-gradient(135deg, #5f84ff, #69b5ff);
            color: #f8fbff;
            font-size: 12px;
            font-weight: 700;
            border-radius: 999px;
            padding: 7px 14px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            pointer-events: auto !important;
            touch-action: manipulation !important;
        }

        button.action-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        button.action-btn:active {
            transform: scale(0.96);
        }

        button.action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .game-over {
            display: none;
            margin-top: 6px;
            color: #ffc1cd;
            font-size: 15px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 106, 134, 0.3);
        }

        @media (max-width: 768px) {
            .game-container {
                width: 100%;
                border-radius: 16px;
                padding: 8px;
            }

            h1 {
                font-size: 16px;
            }

            .score-card .value {
                font-size: 13px;
            }

            .difficulty-btn,
            .map-btn {
                font-size: 10px;
                padding: 4px 8px;
            }

            button.action-btn {
                font-size: 11px;
                padding: 6px 11px;
            }
        }
    </style>
    <link rel="stylesheet" href="/common/loader.css?v=1.1">
    <link rel="stylesheet" href="/common/celebration.css?v=1.1">
</head>
<body>
    <div id="game-loader" class="game-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">加载中</div>
    </div>

    <a href="/" class="home-btn" aria-label="返回首页">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>

    <div class="game-container">
        <div class="title-wrap">
            <svg class="logo-icon" viewBox="0 0 64 64" role="img" aria-label="贪吃蛇 图标">
                <path d="M12 20c0-6 6-10 12-10h16c8 0 12 4 12 10s-6 10-12 10H28c-6 0-10 4-10 9s4 9 10 9h20" fill="none" stroke="#4de6a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="18" cy="20" r="3" fill="#4de6a8"/>
            </svg>
            <h1>贪吃蛇冲刺</h1>
        </div>

        <div class="scoreboard">
            <div class="score-card">
                <span class="label">当前得分</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="score-card">
                <span class="label">历史最高</span>
                <span class="value" id="highScore">0</span>
            </div>
        </div>

        <div class="menu-grid">
            <div class="control-section difficulty-selector">
                <div class="control-title">难度</div>
                <div class="btn-row">
                    <button class="difficulty-btn selected" data-difficulty="easy">简单</button>
                    <button class="difficulty-btn" data-difficulty="medium">中等</button>
                    <button class="difficulty-btn" data-difficulty="hard">困难</button>
                </div>
            </div>
            <div class="control-section map-selector">
                <div class="control-title">地图</div>
                <div class="btn-row map-btns"></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="360" height="360"></canvas>

        <div class="controls">滑动屏幕转向，按住屏幕可短时加速</div>

        <div class="actions">
            <button id="startBtn" class="action-btn">开始游戏</button>
            <button id="pauseBtn" class="action-btn" style="display: none;">暂停</button>
            <button id="restartBtn" class="action-btn" style="display: none;">重新开始</button>
        </div>

        <div class="game-over" id="gameOver">游戏结束！</div>
    </div>

    <script src="game.js?v=1.1"></script>
    <script src="/common/audio.js?v=1.1"></script>
    <script src="/common/celebration.js?v=1.1"></script>
    <script src="/common/share.js?v=1.1"></script>
    <script src="/common/anti-longpress.js?v=1.1"></script>
    <script src="/common/loader.js?v=1.1"></script>
</body>
</html>
