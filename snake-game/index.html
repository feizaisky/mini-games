<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>贪吃蛇游戏</title>
    <!-- 微信浏览器适配 -->
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
            touch-action: manipulation;
            overflow-y: auto;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            margin-top: env(safe-area-inset-top, 10px);
        }
        h1 {
            color: #333;
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        .score {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }
        .controls {
            display: none;
        }
        .difficulty-selector {
            margin-bottom: 10px;
        }
        .difficulty-selector .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .difficulty-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .difficulty-btn {
            background: #f0f0f0;
            color: #666;
            border: 2px solid #ddd;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
        }
        .difficulty-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .game-over {
            display: none;
            color: #e74c3c;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        button.action-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            pointer-events: auto !important;
            touch-action: manipulation !important;
            -webkit-tap-highlight-color: rgba(102, 126, 234, 0.3);
        }
        button.action-btn:hover {
            background: #764ba2;
        }
        button.action-btn:active {
            transform: scale(0.95);
            background: #764ba2;
        }
        button.action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .mobile-controls {
            display: none;
            margin-top: 12px;
            gap: 8px;
        }
        .mobile-controls button {
            padding: 12px 18px;
            font-size: 20px;
            width: 55px;
            height: 55px;
        }
        @media (max-width: 768px) {
            .game-container {
                padding: 12px;
            }
            h1 {
                font-size: 18px;
            }
            .score {
                font-size: 14px;
            }
            #gameCanvas {
                max-width: 100%;
                height: auto;
            }
            .mobile-controls {
                display: grid;
                grid-template-areas:
                    ". up ."
                    "left down right";
                justify-content: center;
                gap: 5px;
            }
            .mobile-controls .up { grid-area: up; }
            .mobile-controls .down { grid-area: down; }
            .mobile-controls .left { grid-area: left; }
            .mobile-controls .right { grid-area: right; }
            .game-over {
                font-size: 18px;
            }
            .difficulty-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
        @media (max-width: 400px) {
            .game-container {
                padding: 10px;
            }
            h1 {
                font-size: 16px;
            }
            .score {
                font-size: 13px;
            }
            .difficulty-btns {
                gap: 5px;
            }
            .difficulty-btn {
                padding: 5px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score">
            得分: <span id="score">0</span> |
            最高分: <span id="highScore">0</span>
        </div>

        <div class="difficulty-selector">
            <div class="label">选择难度：</div>
            <div class="difficulty-btns">
                <button class="difficulty-btn selected" data-difficulty="easy">简单</button>
                <button class="difficulty-btn" data-difficulty="medium">中等</button>
                <button class="difficulty-btn" data-difficulty="hard">困难</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="360" height="360"></canvas>
        <div class="controls">
            使用方向键 ↑ ↓ ← → 控制蛇的移动<br>
            点击画布或按钮也可以开始游戏
        </div>
        <button id="startBtn" class="action-btn">开始游戏</button>
        <div class="game-over" id="gameOver">游戏结束！</div>
        <button id="restartBtn" class="action-btn" style="display: none;">重新开始</button>

        <!-- 移动端控制按钮 -->
        <div class="mobile-controls">
            <button class="up" onclick="mobileControl('up')">↑</button>
            <button class="left" onclick="mobileControl('left')">←</button>
            <button class="down" onclick="mobileControl('down')">↓</button>
            <button class="right" onclick="mobileControl('right')">→</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        function mobileControl(direction) {
            const event = new KeyboardEvent('keydown', {
                keyCode: direction === 'up' ? 38 : direction === 'down' ? 40 : direction === 'left' ? 37 : 39
            });
            document.dispatchEvent(event);
        }
    </script>
</body>
</html>
