<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>俄罗斯方块</title>
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
            touch-action: manipulation;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            max-width: 380px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin: 0 0 16px 0;
            font-size: 22px;
        }
        .game-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }
        #gameCanvas {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
            background: #111;
            display: block;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .info-box {
            background: #f8f9fa;
            padding: 12px 14px;
            border-radius: 10px;
            text-align: center;
            min-width: 75px;
        }
        .info-box .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }
        .info-box .value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .next-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .next-box .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }
        #nextCanvas {
            border: 2px solid #ddd;
            border-radius: 5px;
            background: #111;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        button:active {
            transform: scale(0.95);
        }
        .game-over {
            display: none;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            margin: 14px 0;
            padding: 14px;
            border-radius: 10px;
        }
        .game-over.show {
            display: block;
            background: #fff3cd;
            color: #856404;
        }
        .swipe-hint {
            margin: 12px 0;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 10px;
            font-size: 13px;
            color: #667eea;
        }
        .swipe-hint p {
            margin: 0;
        }
        .controls {
            display: grid;
            grid-template-areas:
                ". up ."
                "left down right";
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
        }
        .controls button {
            width: 60px;
            height: 60px;
            font-size: 22px;
            padding: 14px;
        }
        .controls .up { grid-area: up; }
        .controls .down { grid-area: down; }
        .controls .left { grid-area: left; }
        .controls .right { grid-area: right; }
        @media (max-width: 768px) {
            body {
                padding: env(safe-area-inset-top) 8px 8px 8px;
                align-items: flex-start;
            }
            .game-container {
                padding: 16px;
                margin-top: env(safe-area-inset-top, 8px);
            }
            h1 {
                font-size: 20px;
                margin-bottom: 14px;
            }
            .game-wrapper {
                gap: 14px;
                margin-bottom: 14px;
            }
            .info-box {
                min-width: 70px;
                padding: 10px 12px;
            }
            .info-box .label {
                font-size: 12px;
            }
            .info-box .value {
                font-size: 18px;
            }
            .controls button {
                width: 56px;
                height: 56px;
                font-size: 20px;
            }
        }
        @media (max-width: 400px) {
            .game-container {
                padding: 8px;
            }
            h1 {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 俄罗斯方块</h1>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="150" height="300"></canvas>

            <div class="side-panel">
                <div class="info-box">
                    <div class="label">得分</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="info-box">
                    <div class="label">等级</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="info-box">
                    <div class="label">最高分</div>
                    <div class="value" id="highScore">0</div>
                </div>
                <div class="next-box">
                    <div class="label">下一个</div>
                    <canvas id="nextCanvas" width="50" height="50"></canvas>
                </div>
                <button id="startBtn">开始</button>
            </div>
        </div>

        <div class="game-over" id="gameOver"></div>

        <div class="swipe-hint">
            <p>👆 上滑旋转 · 👈👆 左右移动 · 👇 下滑直接落下</p>
        </div>

        <div class="controls">
            <button class="up" onclick="mobileControl('rotate')">↻</button>
            <button class="left" onclick="mobileControl('left')">←</button>
            <button class="down" onclick="mobileControl('down')">↓</button>
            <button class="right" onclick="mobileControl('right')">→</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        function mobileControl(action) {
            if (action === 'left') {
                tetris.moveLeft();
            } else if (action === 'right') {
                tetris.moveRight();
            } else if (action === 'down') {
                tetris.moveDown();
            } else if (action === 'rotate') {
                tetris.rotate();
            }
        }
    </script>
</body>
</html>
