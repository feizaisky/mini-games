<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>俄罗斯方块</title>
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
            touch-action: manipulation;
            overflow-y: auto;
        }
        .game-container {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            margin-top: env(safe-area-inset-top, 5px);
        }
        h1 {
            color: #333;
            margin: 0;
            font-size: 16px;
            width: 100%;
        }
        #gameCanvas {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
            background: #111;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 80px;
        }
        .score-box {
            background: #bbada0;
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .score-box .label {
            font-size: 10px;
            color: #eee4da;
        }
        .score-box .value {
            font-size: 16px;
            font-weight: bold;
        }
        .next-piece {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .next-piece h3 {
            margin: 0 0 5px 0;
            font-size: 11px;
            color: #666;
        }
        #nextCanvas {
            border: 2px solid #ddd;
            border-radius: 5px;
            background: #111;
        }
        .controls {
            display: none;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        button:active {
            transform: scale(0.95);
        }
        .game-over {
            display: none;
            color: #e74c3c;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 5px;
        }
        .mobile-controls {
            display: none;
        }
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }
            h1 {
                font-size: 14px;
                margin-bottom: 3px;
            }
            .side-panel {
                flex-direction: row;
                justify-content: space-between;
                gap: 5px;
                width: 100%;
            }
            .score-box {
                flex: 1;
                padding: 5px;
                min-width: 50px;
            }
            .score-box .label {
                font-size: 9px;
            }
            .score-box .value {
                font-size: 14px;
            }
            .next-piece {
                padding: 5px;
            }
            .next-piece h3 {
                font-size: 10px;
            }
            #gameCanvas {
                max-width: 100%;
                height: auto;
            }
            #nextCanvas {
                max-width: 100%;
                height: auto;
            }
            .mobile-controls {
                display: grid;
                grid-template-areas:
                    ". up ."
                    "left down right";
                justify-content: center;
                gap: 5px;
                width: 100%;
            }
            .mobile-controls button {
                width: 50px;
                height: 50px;
                font-size: 18px;
                padding: 10px;
            }
            .mobile-controls .up { grid-area: up; }
            .mobile-controls .down { grid-area: down; }
            .mobile-controls .left { grid-area: left; }
            .mobile-controls .right { grid-area: right; }
        }
        @media (max-width: 400px) {
            .game-container {
                padding: 6px;
            }
            .score-box .value {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div style="display: flex; gap: 10px; width: 100%; align-items: flex-start;">
            <div style="flex: 1;">
                <h1>🎯 俄罗斯方块</h1>
                <canvas id="gameCanvas" width="240" height="480"></canvas>
            </div>
            <div class="side-panel">
                <div class="score-box">
                    <div class="label">得分</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="label">最高分</div>
                    <div class="value" id="highScore">0</div>
                </div>
                <div class="score-box">
                    <div class="label">等级</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="next-piece">
                    <h3>下一个</h3>
                    <canvas id="nextCanvas" width="80" height="80"></canvas>
                </div>
                <button id="startBtn">开始</button>
            </div>
        </div>
        <div class="game-over" id="gameOver"></div>
        <!-- 移动端控制 -->
        <div class="mobile-controls">
            <button class="up" onclick="mobileControl('rotate')">↻</button>
            <button class="left" onclick="mobileControl('left')">←</button>
            <button class="down" onclick="mobileControl('down')">↓</button>
            <button class="right" onclick="mobileControl('right')">→</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
        function mobileControl(action) {
            if (action === 'left') {
                tetris.moveLeft();
            } else if (action === 'right') {
                tetris.moveRight();
            } else if (action === 'down') {
                tetris.moveDown();
            } else if (action === 'rotate') {
                tetris.rotate();
            }
        }
    </script>
</body>
</html>
