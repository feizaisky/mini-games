<head>

    <!-- 微信浏览器适配 -->

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 700px;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            margin-top: 0;
        }
        .subtitle {
            color: #666;
            margin-bottom: 15px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .game-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }
        .game-card:active {
            transform: scale(0.95);
            background: #f0f0f0;
        }
        .game-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-icon svg {
            width: 40px;
            height: 40px;
            display: block;
        }
        .game-icon img {
            width: 40px;
            height: 40px;
            display: block;
        }
        .game-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }
        .game-desc {
            font-size: 11px;
            color: #999;
        }
        .coming-soon {
            color: #999;
            font-style: italic;
            margin-top: 10px;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .category-tab {
            background: #f0f0f0;
            color: #666;
            border: 2px solid transparent;
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .category-title {
            font-size: 14px;
            color: #888;
            text-align: left;
            margin: 12px 0 6px 4px;
            font-weight: 600;
        }
        .score-item {
            cursor: pointer;
            transition: all 0.2s;
        }
        .score-item:hover {
            transform: scale(1.03);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .clear-scores-btn {
            background: none;
            border: 1px solid #ddd;
            color: #999;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        .clear-scores-btn:hover {
            color: #e74c3c;
            border-color: #e74c3c;
        }
        .my-scores {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }
        .my-scores h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .score-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .score-item .game-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .score-item .score-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        .score-item .no-score {
            font-size: 14px;
            color: #999;
        }
        @media (max-width: 768px) {
            .container {
                padding: 18px 15px;
                margin: 8px;
            }
            h1 {
                font-size: 20px;
            }
            .subtitle {
                font-size: 13px;
                margin-bottom: 15px;
            }
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .game-card {
                padding: 15px 10px;
            }
            .game-icon {
                font-size: 32px;
                margin-bottom: 8px;
            }
            .game-icon svg {
                width: 32px;
                height: 32px;
            }
            .game-icon img {
                width: 32px;
                height: 32px;
            }
            .game-title {
                font-size: 13px;
            }
            .game-desc {
                font-size: 10px;
            }
            .my-scores h2 {
                font-size: 16px;
            }
            .scores-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .score-item {
                padding: 10px;
            }
            .score-item .score-value {
                font-size: 18px;
            }
        }
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .scores-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

    <script>
        // 分类筛选
        (function() {
            var tabs = document.querySelectorAll('.category-tab');
            var cards = document.querySelectorAll('.game-card');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    var cat = tab.dataset.cat;
                    cards.forEach(function(card) {
                        if (cat === 'all' || card.dataset.category === cat) {
                            card.style.display = '';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        })();

        // 记录访问（用于最近游玩排序）
        document.querySelectorAll('.game-card').forEach(function(card) {
            card.addEventListener('click', function() {
                var href = card.getAttribute('href');
                if (href) {
                    try { localStorage.setItem('lastPlayed_' + href, Date.now()); } catch(e) {}
                }
            });
        });

        // 加载各游戏的最高分
        function addScoreItem(grid, icon, name, value, href) {
            var item = document.createElement('a');
            item.className = 'score-item';
            item.href = href;
            item.style.textDecoration = 'none';
            item.style.color = 'inherit';
            item.innerHTML = '<div class="game-name">' + icon + ' ' + name + '</div><div class="score-value">' + value + '</div>';
            grid.appendChild(item);
            return true;
        }

        function formatTime(seconds) {
            var m = Math.floor(parseInt(seconds) / 60);
            var s = parseInt(seconds) % 60;
            return m + ':' + s.toString().padStart(2, '0');
        }

        function loadScores() {
            var grid = document.getElementById('scoresGrid');
            grid.innerHTML = '';
            var hasScores = false;

            // 简单分数类
            var simpleGames = [
                { key: 'snakeHighScore', name: '贪吃蛇', icon: '🐍', href: './snake-game/', suffix: '分' },
                { key: 'bestScore2048', name: '2048', icon: '🃏', href: './2048/', suffix: '分' },
                { key: 'tetrisHighScore', name: '俄罗斯方块', icon: '🎯', href: './tetris/', suffix: '分' },
                { key: 'whackMoleHighScore', name: '打地鼠', icon: '🔨', href: './whack-a-mole/', suffix: '分' }
            ];

            simpleGames.forEach(function(g) {
                var val = localStorage.getItem(g.key);
                if (val) { hasScores = addScoreItem(grid, g.icon, g.name, val + (g.suffix || ''), g.href); }
            });

            // 记忆翻牌
            var mm = localStorage.getItem('memoryBestMoves');
            var mt = localStorage.getItem('memoryBestTime');
            if (mm && mt) { hasScores = addScoreItem(grid, '🧠', '记忆翻牌', mm + '步 / ' + formatTime(mt), './memory-game/'); }

            // 数独
            var st = localStorage.getItem('sudokuBestTime');
            if (st) { hasScores = addScoreItem(grid, '🔢', '数独', formatTime(st), './sudoku/'); }

            // 井字棋
            var tw = localStorage.getItem('tictactoeWins');
            if (tw && parseInt(tw) > 0) { hasScores = addScoreItem(grid, '⭕', '井字棋', tw + '胜', './tic-tac-toe/'); }

            // 拼图
            try {
                var pr = localStorage.getItem('puzzleV2Best_3');
                if (pr) {
                    var pb = JSON.parse(pr);
                    hasScores = addScoreItem(grid, '🧩', '拼图', (pb.moves || 0) + '步 / ' + formatTime(pb.time || 0), './puzzle/');
                }
            } catch(e) {}

            // 熄灯
            try {
                var lr = localStorage.getItem('lightsOutBest');
                if (lr) {
                    var lb = JSON.parse(lr);
                    if (lb && lb.moves !== undefined) {
                        var dlm = { easy: '轻松', normal: '经典', hard: '进阶' };
                        hasScores = addScoreItem(grid, '💡', '熄灯', lb.moves + '步 / ' + formatTime(lb.time || 0), './lights-out/');
                    }
                }
            } catch(e) {}

            // 一笔画
            try {
                var or = localStorage.getItem('oneStrokeBest');
                if (or) {
                    var ob = JSON.parse(or);
                    if (ob && ob.moves !== undefined) {
                        hasScores = addScoreItem(grid, '✍️', '一笔画', (ob.level || '') + ' ' + formatTime(ob.time || 0), './one-stroke/');
                    }
                }
            } catch(e) {}

            // 塔防
            try {
                var td = localStorage.getItem('td_progress_v1');
                if (td) {
                    var tp = JSON.parse(td);
                    var maxWave = Math.max.apply(null, tp.bestWaves || [0]);
                    if (maxWave > 0) { hasScores = addScoreItem(grid, '🏰', '塔防', '最高' + maxWave + '波', './tower-defense/'); }
                }
            } catch(e) {}

            if (!hasScores) {
                grid.innerHTML = '<p style="color: #999; grid-column: 1 / -1;">暂无游戏记录，快去玩游戏吧！</p>';
            } else {
                // 添加清除按钮
                var clearWrap = document.createElement('div');
                clearWrap.style.cssText = 'grid-column: 1 / -1; text-align: center;';
                clearWrap.innerHTML = '<button class="clear-scores-btn" onclick="clearAllScores()">清除所有记录</button>';
                grid.appendChild(clearWrap);
            }
        }

        function clearAllScores() {
            if (!confirm('确定要清除所有游戏记录吗？')) return;
            var keys = ['snakeHighScore','bestScore2048','tetrisHighScore','whackMoleHighScore',
                'memoryBestMoves','memoryBestTime','sudokuBestTime','sudokuGamesWon','sudokuDifficulty',
                'tictactoeWins','tictactoeLosses','tictactoeDraws',
                'puzzleV2Best_3','puzzleV2Best_4','puzzleV2Best_5','puzzleV2Unlock',
                'lightsOutBest','oneStrokeBest','oneStrokeUnlocked','td_progress_v1','td_achievements_v1',
                'mbtiHistory'];
            keys.forEach(function(k) { localStorage.removeItem(k); });
            // 清除所有 lightsOutBest_ 前缀的键
            for (var i = localStorage.length - 1; i >= 0; i--) {
                var key = localStorage.key(i);
                if (key && key.startsWith('lightsOutBest_')) localStorage.removeItem(key);
                if (key && key.startsWith('lastPlayed_')) localStorage.removeItem(key);
            }
            loadScores();
        }

        loadScores();
    </script>
</body>
</html>
