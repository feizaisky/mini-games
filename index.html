<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏中心</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            margin-top: 0;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .game-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }
        .game-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .game-desc {
            font-size: 12px;
            color: #999;
        }
        .coming-soon {
            color: #999;
            font-style: italic;
            margin-top: 20px;
        }
        .my-scores {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .my-scores h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .score-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .score-item .game-name {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .score-item .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .score-item .no-score {
            font-size: 14px;
            color: #999;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
                margin: 10px;
            }
            h1 {
                font-size: 24px;
            }
            .subtitle {
                font-size: 14px;
                margin-bottom: 20px;
            }
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .game-card {
                padding: 15px 10px;
            }
            .game-icon {
                font-size: 36px;
                margin-bottom: 10px;
            }
            .game-title {
                font-size: 14px;
            }
            .game-desc {
                font-size: 10px;
            }
            .my-scores h2 {
                font-size: 18px;
            }
            .scores-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .score-item {
                padding: 10px;
            }
            .score-item .score-value {
                font-size: 20px;
            }
        }
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            .scores-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 小游戏中心</h1>
        <p class="subtitle">精选网页小游戏，随时畅玩</p>

        <div class="games-grid">
            <a href="/snake-game/" class="game-card">
                <div class="game-icon">🐍</div>
                <div class="game-title">贪吃蛇</div>
                <div class="game-desc">经典贪吃蛇游戏</div>
            </a>

            <a href="/2048/" class="game-card">
                <div class="game-icon">🃏</div>
                <div class="game-title">2048</div>
                <div class="game-desc">经典数字合并游戏</div>
            </a>

            <a href="/tetris/" class="game-card">
                <div class="game-icon">🎯</div>
                <div class="game-title">俄罗斯方块</div>
                <div class="game-desc">经典方块消除游戏</div>
            </a>

            <!-- 更多游戏占位 -->
            <a href="#" class="game-card" style="opacity: 0.5; cursor: not-allowed;">
                <div class="game-icon">🏓</div>
                <div class="game-title">乒乓球</div>
                <div class="game-desc">敬请期待</div>
            </a>
        </div>

        <p class="coming-soon">更多精彩游戏，敬请期待...</p>

        <div class="my-scores">
            <h2>🏆 我的成绩</h2>
            <div class="scores-grid" id="scoresGrid">
                <!-- 成绩将由 JavaScript 动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // 加载各游戏的最高分
        function loadScores() {
            const scoresGrid = document.getElementById('scoresGrid');
            const games = [
                { key: 'snakeHighScore', name: '贪吃蛇', icon: '🐍' },
                { key: 'bestScore2048', name: '2048', icon: '🃏' },
                { key: 'tetrisHighScore', name: '俄罗斯方块', icon: '🎯' }
            ];

            let hasScores = false;

            games.forEach(game => {
                const score = localStorage.getItem(game.key);
                if (score) {
                    hasScores = true;
                    const scoreItem = document.createElement('div');
                    scoreItem.className = 'score-item';
                    scoreItem.innerHTML = `
                        <div class="game-name">${game.icon} ${game.name}</div>
                        <div class="score-value">${score}</div>
                    `;
                    scoresGrid.appendChild(scoreItem);
                }
            });

            if (!hasScores) {
                scoresGrid.innerHTML = '<p style="color: #999; grid-column: 1 / -1;">暂无游戏记录，快去玩游戏吧！</p>';
            }
        }

        // 页面加载时读取成绩
        loadScores();
    </script>
</body>
</html>
