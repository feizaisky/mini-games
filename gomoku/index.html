<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五子棋游戏</title>
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            background: linear-gradient(135deg, #FFE5B4 0%, #FFCC80 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
            touch-action: manipulation;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            max-width: 380px;
            width: 100%;
        }
        h1 {
            color: #FF6B6B;
            margin: 0 0 15px 0;
            font-size: 24px;
            font-weight: bold;
        }
        .status {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
            min-height: 22px;
            background: #FFF9E6;
            padding: 10px 15px;
            border-radius: 15px;
        }
        .status span {
            font-weight: bold;
        }
        .status .black-turn {
            color: #333;
        }
        .status .white-turn {
            color: #999;
        }
        .difficulty-selector {
            margin-bottom: 15px;
        }
        .difficulty-selector .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }
        .difficulty-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .difficulty-btn {
            background: #FFF;
            color: #666;
            border: 2px solid #FFE5B4;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0;
        }
        .difficulty-btn.selected {
            background: #FFCC80;
            color: #FFF;
            border-color: #FFCC80;
            font-weight: bold;
        }
        #gameCanvas {
            border: 4px solid #8B4513;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
            cursor: pointer;
            display: block;
            margin: 0 auto 15px auto;
            background: #F5DEB3;
        }
        .game-over {
            display: none;
            font-size: 18px;
            font-weight: bold;
            margin: 12px 0;
            padding: 12px;
            border-radius: 15px;
        }
        .game-over.win {
            color: #27ae60;
            background: #D5F4E6;
        }
        .game-over.lose {
            color: #e74c3c;
            background: #FADBD8;
        }
        .game-over.draw {
            color: #f39c12;
            background: #FEF5E7;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(78, 205, 196, 0.3);
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(78, 205, 196, 0.3);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #FFF9E6;
            padding: 6px 12px;
            border-radius: 15px;
        }
        .legend-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .legend-dot.black {
            background: radial-gradient(circle at 30% 30%, #555, #000);
        }
        .legend-dot.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
        }
        @media (max-width: 768px) {
            body {
                padding: env(safe-area-inset-top) 10px 10px 10px;
                align-items: flex-start;
            }
            .game-container {
                padding: 15px;
                margin-top: env(safe-area-inset-top, 10px);
            }
            h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }
            .status {
                font-size: 14px;
                padding: 8px 12px;
                margin-bottom: 12px;
            }
            .difficulty-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            #gameCanvas {
                margin-bottom: 12px;
            }
            button {
                padding: 10px 16px;
                font-size: 13px;
            }
            .legend {
                gap: 15px;
                margin-bottom: 12px;
            }
        }
        @media (max-width: 400px) {
            .game-container {
                padding: 12px;
            }
            h1 {
                font-size: 18px;
            }
            .difficulty-btns {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚫⚪ 五子棋</h1>
        <div class="status">
            轮到: <span id="currentPlayer" class="black-turn">黑棋（你）</span>
        </div>

        <div class="difficulty-selector">
            <div class="label">选择难度:</div>
            <div class="difficulty-btns">
                <button class="difficulty-btn selected" data-difficulty="easy">简单</button>
                <button class="difficulty-btn" data-difficulty="medium">中等</button>
                <button class="difficulty-btn" data-difficulty="hard">困难</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="300" height="300"></canvas>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot black"></div>
                <span>你（黑棋）</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot white"></div>
                <span>电脑（白棋）</span>
            </div>
        </div>

        <div class="game-over" id="gameOver"></div>

        <div class="btn-group">
            <button id="undoBtn">↩ 悔棋</button>
            <button id="restartBtn">🔄 重新开始</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
