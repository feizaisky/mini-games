<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 100%;
        }
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
                margin: 10px;
            }
            h1 {
                font-size: 20px;
            }
            .scores {
                gap: 10px;
            }
            .score-box {
                padding: 8px 15px;
                min-width: 80px;
            }
            .score-box .label {
                font-size: 10px;
            }
            .score-box .value {
                font-size: 18px;
            }
            .game-board {
                padding: 8px;
            }
            .controls {
                font-size: 12px;
            }
            button {
                padding: 10px 25px;
                font-size: 14px;
            }
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            margin-top: 0;
        }
        .scores {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .score-box {
            background: #bbada0;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 100px;
        }
        .score-box .label {
            font-size: 12px;
            color: #eee4da;
        }
        .score-box .value {
            font-size: 24px;
            font-weight: bold;
        }
        .game-board {
            background: #bbada0;
            border-radius: 10px;
            padding: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
        }
        .grid-cell {
            background: #cdc1b4;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s;
        }
        .grid-cell.tile-2 { background: #eee4da; color: #776e65; }
        .grid-cell.tile-4 { background: #ede0c8; color: #776e65; }
        .grid-cell.tile-8 { background: #f2b179; color: #f9f6f2; }
        .grid-cell.tile-16 { background: #f59563; color: #f9f6f2; }
        .grid-cell.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .grid-cell.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .grid-cell.tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
        .grid-cell.tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }
        .grid-cell.tile-super { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
        .controls {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .game-over {
            display: none;
            color: #e74c3c;
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }
        .game-won {
            display: none;
            color: #27ae60;
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
                gap: 8px;
            }
            .grid-cell {
                font-size: 24px;
            }
            .grid-cell.tile-128, .grid-cell.tile-256, .grid-cell.tile-512 {
                font-size: 20px;
            }
            .grid-cell.tile-1024, .grid-cell.tile-2048 {
                font-size: 16px;
            }
        }
        @media (max-width: 350px) {
            .grid-container {
                grid-template-columns: repeat(4, 50px);
                grid-template-rows: repeat(4, 50px);
                gap: 6px;
            }
            .grid-cell {
                font-size: 20px;
            }
            .grid-cell.tile-128, .grid-cell.tile-256, .grid-cell.tile-512 {
                font-size: 16px;
            }
            .grid-cell.tile-1024, .grid-cell.tile-2048 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 2048</h1>
        <div class="scores">
            <div class="score-box">
                <div class="label">得分</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="bestScore">0</div>
            </div>
        </div>
        <div class="game-board">
            <div class="grid-container" id="grid">
            </div>
        </div>
        <div class="controls">
            使用方向键 ↑ ↓ ← → 或滑动屏幕来移动方块<br>
            相同的数字碰撞时会合并
        </div>
        <button id="newGameBtn">新游戏</button>
        <div class="game-over" id="gameOver">
            游戏结束！
        </div>
        <div class="game-won" id="gameWon">
            恭喜你达成 2048！🎉
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
