<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2048 游戏</title>
    <style>
        :root {
            --bg-top: #f3efe6;
            --bg-bottom: #e7ddcd;
            --panel: rgba(255, 252, 247, 0.95);
            --panel-border: #d4c7b5;
            --text-main: #5f5548;
            --text-muted: #8f8375;
            --chip-bg: #bbada0;
            --chip-text: #f9f6f2;
            --btn-main: #6a88f7;
            --btn-main-hover: #5675ea;
            --btn-sub: #8f7a66;
            --btn-sub-hover: #7c6856;
            --tile-bg: #cdc1b4;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.5), transparent 36%),
                radial-gradient(circle at 85% 82%, rgba(255, 246, 226, 0.55), transparent 30%),
                linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
        }

        .home-btn {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #d8cfc4;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 16px rgba(97, 81, 62, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 1000;
        }

        .home-btn svg {
            width: 22px;
            height: 22px;
            fill: #6a88f7;
        }

        .game-container {
            width: min(100%, 520px);
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 16px 28px rgba(120, 102, 82, 0.2);
            padding: 10px;
        }

        .head {
            margin-bottom: 6px;
        }

        h1 {
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            line-height: 1;
            color: #5d5244;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            display: inline-block;
        }

        .sub {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .scores {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .score-box {
            background: var(--chip-bg);
            color: var(--chip-text);
            padding: 6px 8px;
            border-radius: 10px;
        }

        .score-box .label {
            font-size: 11px;
            color: #eee4da;
        }

        .score-box .value {
            font-size: 20px;
            font-weight: 700;
        }

        .mode-box {
            background: var(--chip-bg);
            color: var(--chip-text);
            border-radius: 10px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #f9f6f2;
            cursor: pointer;
        }

        #spawn8Toggle {
            appearance: none;
            width: 34px;
            height: 20px;
            border-radius: 999px;
            background: rgba(239, 231, 219, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.65);
            position: relative;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #spawn8Toggle::after {
            content: "";
            position: absolute;
            top: 1px;
            left: 1px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s ease;
        }

        #spawn8Toggle:checked {
            background: var(--btn-main);
        }

        #spawn8Toggle:checked::after {
            transform: translateX(14px);
        }

        .game-board {
            background: var(--chip-bg);
            border-radius: 12px;
            padding: 8px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 72px);
            grid-template-rows: repeat(4, 72px);
            gap: 8px;
        }

        .grid-cell {
            background: var(--tile-bg);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 700;
            color: #776e65;
            transition: all 0.15s;
        }

        .grid-cell.tile-2 { background: #eee4da; color: #776e65; }
        .grid-cell.tile-4 { background: #ede0c8; color: #776e65; }
        .grid-cell.tile-8 { background: #f2b179; color: #f9f6f2; }
        .grid-cell.tile-16 { background: #f59563; color: #f9f6f2; }
        .grid-cell.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .grid-cell.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .grid-cell.tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .grid-cell.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
        .grid-cell.tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }
        .grid-cell.tile-super { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
        .grid-cell.tile-merged { animation: mergePop 0.25s ease; }
        .grid-cell.tile-new { animation: tileAppear 0.2s ease; }

        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 6px;
        }

        button {
            border: none;
            color: #fff;
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.15s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        #newGameBtn,
        #reviveBtn {
            background: var(--btn-main);
        }

        #newGameBtn:hover,
        #reviveBtn:hover {
            background: var(--btn-main-hover);
        }

        #undoBtn {
            background: var(--btn-sub);
        }

        #undoBtn:hover {
            background: var(--btn-sub-hover);
        }

        .status-line {
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-over,
        .game-won {
            display: none;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        .game-over { color: #e74c3c; }
        .game-won { color: #27ae60; }

        .new-record-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10000;
            pointer-events: none;
            animation: recordToast 1.5s ease forwards;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        @keyframes recordToast {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            30% { transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 8px;
                border-radius: 14px;
            }

            h1 {
                font-size: 21px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 62px);
                grid-template-rows: repeat(4, 62px);
                gap: 7px;
            }

            .grid-cell {
                font-size: 24px;
            }

            .grid-cell.tile-128,
            .grid-cell.tile-256,
            .grid-cell.tile-512 {
                font-size: 22px;
            }

            .grid-cell.tile-1024,
            .grid-cell.tile-2048 {
                font-size: 18px;
            }

            .controls {
                font-size: 12px;
            }

            button {
                font-size: 13px;
                padding: 7px 8px;
            }
        }

        @media (max-width: 360px) {
            .grid-container {
                grid-template-columns: repeat(4, 52px);
                grid-template-rows: repeat(4, 52px);
                gap: 6px;
            }

            .grid-cell {
                font-size: 22px;
            }

            .grid-cell.tile-128,
            .grid-cell.tile-256,
            .grid-cell.tile-512 {
                font-size: 18px;
            }

            .grid-cell.tile-1024,
            .grid-cell.tile-2048 {
                font-size: 14px;
            }

            .scores {
                gap: 4px;
            }

            .score-box .value {
                font-size: 17px;
            }
        }
    </style>
    <link rel="stylesheet" href="/common/loader.css?v=1.1">
    <link rel="stylesheet" href="/common/celebration.css?v=1.1">
</head>
<body>
    <div id="game-loader" class="game-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">加载中</div>
    </div>

    <a href="/" class="home-btn" aria-label="返回首页">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>

    <div class="game-container">
        <div class="head">
            <h1>
                <svg class="logo-icon" viewBox="0 0 64 64" role="img" aria-label="2048 图标">
                    <rect x="6" y="6" width="52" height="52" rx="14" fill="#f2b179"/>
                    <rect x="12" y="12" width="40" height="40" rx="10" fill="#f5c57a"/>
                    <text x="32" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">2048</text>
                </svg>
                2048
            </h1>
            <div class="sub">滑动合并，冲击更高分</div>
        </div>

        <div class="scores">
            <div class="score-box">
                <div class="label">得分</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="bestScore">0</div>
            </div>
            <div class="mode-box">
                <label class="mode-toggle" for="spawn8Toggle">
                    <input id="spawn8Toggle" type="checkbox">
                    <span>打开8</span>
                </label>
            </div>
        </div>

        <div class="game-board">
            <div class="grid-container" id="grid"></div>
        </div>

        <div class="controls">
            使用方向键 ↑ ↓ ← → 或滑动屏幕移动方块<br>
            相同数字碰撞会自动合并
        </div>

        <div class="actions">
            <button id="newGameBtn">新游戏</button>
            <button id="undoBtn">撤销 (<span id="undoCount">3</span>)</button>
        </div>

        <div class="status-line">
            <div class="game-over" id="gameOver">游戏结束！</div>
            <div class="game-won" id="gameWon">恭喜你达成 2048！🎉</div>
        </div>
    </div>

    <script src="game.js?v=1.1"></script>
    <script src="/common/audio.js?v=1.1"></script>
    <script src="/common/celebration.js?v=1.1"></script>
    <script src="/common/share.js?v=1.1"></script>
    <script src="/common/anti-longpress.js?v=1.1"></script>
    <script src="/common/loader.js?v=1.1"></script>
</body>
</html>
