<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>弹球台</title>
    <style>
        :root {
            --bg0: #e2f5ef;
            --bg1: #b6e8db;
            --panel: rgba(248, 255, 252, .93);
            --ink: #1f4f45;
            --muted: #4f8277;
            --accent: #2dc19a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100svh;
            padding: max(4px, env(safe-area-inset-top)) 8px max(4px, env(safe-area-inset-bottom));
            background: radial-gradient(circle at 10% 10%, rgba(255,255,255,.55), transparent 36%), linear-gradient(165deg, var(--bg0), var(--bg1));
        }
        .home-btn {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            border: 1px solid rgba(54, 147, 123, .35);
            box-shadow: 0 8px 18px rgba(54, 122, 106, .2);
            display: grid;
            place-items: center;
            text-decoration: none;
            z-index: 10;
        }
        .home-btn svg { width: 22px; height: 22px; fill: #2dc19a; }
        .game-wrap {
            width: min(100%, 560px);
            max-height: 100%;
            text-align: center;
            background: var(--panel);
            border-radius: 18px;
            border: 1px solid rgba(62, 148, 125, .3);
            box-shadow: 0 16px 30px rgba(63, 125, 110, .22);
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        h1 { margin: 0 0 4px; font-size: 22px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .title-icon { width: 26px; height: 26px; display: block; }
        .sub { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }
        .stat {
            border-radius: 10px;
            background: rgba(45, 193, 154, .12);
            border: 1px solid rgba(45, 193, 154, .24);
            padding: 5px;
        }
        .stat .k { font-size: 10px; color: var(--muted); }
        .stat .v { font-size: 16px; font-weight: 700; color: var(--ink); }
        .status-line {
            margin: 0 0 6px;
            font-size: 11px;
            color: #2c6b5f;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(45, 193, 154, .12);
            border: 1px solid rgba(45, 193, 154, .24);
            display: grid;
            gap: 2px;
        }
        #gameCanvas {
            width: 100%;
            max-width: 520px;
            aspect-ratio: 13 / 18;
            height: auto;
            background: #102f2b;
            border-radius: 14px;
            border: 2px solid rgba(87, 215, 180, .35);
            display: block;
            margin: 0 auto 8px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), 0 10px 24px rgba(34, 73, 64, .28);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, #2ec39b, #49d8b0);
            cursor: pointer;
            font-size: 14px;
        }
        button.secondary { background: linear-gradient(135deg, #5f9388, #7ba79d); }
        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .touch-btn {
            padding: 12px 0;
            border-radius: 14px;
            border: 1px solid rgba(45, 193, 154, .35);
            background: rgba(103, 222, 190, .18);
            color: #2e695d;
            font-weight: 700;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .touch-controls { display: grid; }
            .title-icon { width: 24px; height: 24px; }
        }
        @media (max-height: 860px) {
            body { padding: max(3px, env(safe-area-inset-top)) 8px max(3px, env(safe-area-inset-bottom)); }
            .game-wrap { padding: 8px; border-radius: 14px; }
            h1 { font-size: 18px; margin-bottom: 2px; }
            .sub { margin-bottom: 6px; font-size: 11px; }
            .stats { gap: 4px; margin-bottom: 6px; }
            .status-line { margin-bottom: 4px; font-size: 10px; padding: 3px 6px; }
            .stat { padding: 4px; }
            .stat .v { font-size: 14px; }
            #gameCanvas { margin-bottom: 6px; max-height: 46vh; width: auto; max-width: 100%; }
            .buttons { margin-bottom: 6px; }
            button { padding: 8px 10px; font-size: 13px; }
            .touch-btn { padding: 10px 0; font-size: 14px; }
        }
        @media (max-height: 700px) {
            #gameCanvas { max-height: 40vh; }
            .stat .v { font-size: 12px; }
            button { padding: 7px 8px; font-size: 12px; }
        }
    </style>
    <link rel="stylesheet" href="/common/loader.css?v=1.1">
    <link rel="stylesheet" href="/common/celebration.css?v=1.1">
</head>
<body>
    <div id="game-loader" class="game-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">加载中</div>
    </div>
    <a href="/" class="home-btn" aria-label="返回首页">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <main class="game-wrap">
        <h1><img src="../common/icons/pinball.svg" class="title-icon" alt="弹球台图标">弹球台</h1>
        <p class="sub">发射钢珠，控制双挡板，冲击倍率高分</p>
        <section class="stats">
            <div class="stat"><div class="k">得分</div><div class="v" id="score">0</div></div>
            <div class="stat"><div class="k">最高分</div><div class="v" id="bestScore">0</div></div>
            <div class="stat"><div class="k">剩余球</div><div class="v" id="ballsLeft">3</div></div>
            <div class="stat"><div class="k">倍率</div><div class="v" id="multiplier">x1.0</div></div>
        </section>
        <div class="status-line">
            <div id="modeDetail">常规模式</div>
            <div id="objectiveText">连续命中 3 次 Bumper (0/3)</div>
        </div>
        <canvas id="gameCanvas" width="520" height="720"></canvas>
        <div class="buttons">
            <button id="startBtn">开始游戏</button>
            <button id="restartBtn" class="secondary">重新开始</button>
        </div>
        <div class="touch-controls">
            <button class="touch-btn" id="leftFlipBtn">左挡板</button>
            <button class="touch-btn" id="launchBtn">发射</button>
            <button class="touch-btn" id="rightFlipBtn">右挡板</button>
        </div>
    </main>
    <script src="/common/canvas-fit.js?v=1.0"></script>
    <script src="game.js?v=1.1"></script>
    <script src="/common/audio.js?v=1.1"></script>
    <script src="/common/celebration.js?v=1.1"></script>
    <script src="/common/share.js?v=1.1"></script>
    <script src="/common/anti-longpress.js?v=1.1"></script>
    <script src="/common/loader.js?v=1.1"></script>
</body>
</html>
